spring.application.name=backend
spring.mvc.problemdetails.enabled=true
logging.level.org.docx4j.model.properties.Property=ERROR
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.datasource.url=jdbc:postgresql://localhost:5432/logistic
spring.datasource.username=logistic
spring.datasource.password=logistic

logistic.storage.root=${user.home}/.logistic-storage

jwt.secret=dev-secret-change-in-production-min-32-chars-long!!
jwt.expiration-ms=86400000

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
