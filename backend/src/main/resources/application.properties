spring.application.name=backend
spring.mvc.problemdetails.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.datasource.url=jdbc:postgresql://localhost:5432/logistic
spring.datasource.username=logistic
spring.datasource.password=logistic

logistic.storage.root=${user.home}/.logistic-storage

# In-memory document bytes cache (per order owner; no disk)
app.documents.cache.ttl=10m
app.documents.cache.max-order-sets-per-owner=5

jwt.secret=dev-secret-change-in-production-min-32-chars-long!!
jwt.expiration-ms=86400000

typedata.enabled=${TYPEDATA_ENABLED:false}
typedata.api-url=https://api.typedata.net/v1/suggest/address
typedata.token=${TYPEDATA_TOKEN:}

app.place-suggestions.max-history=5
app.place-suggestions.max-external=10
app.place-suggestions.external-min-query-length=2

spring.cache.type=caffeine
spring.cache.cache-names=typedataAddressSuggest
spring.cache.caffeine.spec=maximumSize=5000,expireAfterWrite=1h

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
