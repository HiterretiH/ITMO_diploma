<p-toolbar styleClass="shell-toolbar">
  <ng-template #start>
    <a routerLink="/orders" class="brand" tabindex="0">Документооборот</a>
    <a
      routerLink="/orders"
      routerLinkActive="active-link"
      pButton
      class="nav-link"
      [text]="true"
      label="Рейсы"
    ></a>
    <p-button
      type="button"
      label="Справочники"
      icon="pi pi-angle-down"
      [text]="true"
      (onClick)="catalogMenu.toggle($event)"
    />
    <p-menu #catalogMenu [popup]="true" [model]="catalogItems" appendTo="body" />
    @if (auth.hasRole('ADMIN')) {
      <a
        routerLink="/admin/users"
        routerLinkActive="active-link"
        pButton
        class="nav-link"
        [text]="true"
        label="Пользователи"
      ></a>
      <p-button
        type="button"
        label="+ Пользователь"
        icon="pi pi-user-plus"
        [text]="true"
        (onClick)="adminUserDialogVisible = true"
      />
    }
  </ng-template>
  <ng-template #end>
    <p-button
      type="button"
      [icon]="themeIcon()"
      [text]="true"
      rounded="true"
      severity="secondary"
      aria-label="Переключить светлую или тёмную тему"
      title="Тема: светлая или тёмная (нажмите для переключения)"
      (onClick)="cycleTheme()"
    />
    @if (auth.username(); as u) {
      <span class="user-label">{{ u }}</span>
    }
    <p-button
      type="button"
      label="Выход"
      [text]="true"
      severity="secondary"
      (onClick)="auth.logout()"
    />
  </ng-template>
</p-toolbar>

<main class="shell-main">
  <router-outlet />
</main>

<app-user-create-dialog [(visible)]="adminUserDialogVisible" />
