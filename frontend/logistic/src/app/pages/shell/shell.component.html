<p-toolbar>
  <ng-template pTemplate="start">
    <span class="brand">Logistic</span>
    <a
      routerLink="/trips"
      routerLinkActive="active-link"
      pButton
      class="nav-link"
      [text]="true"
      label="Рейсы"
    ></a>
    <p-button
      type="button"
      label="Справочники"
      icon="pi pi-angle-down"
      [text]="true"
      (onClick)="catalogMenu.toggle($event)"
    />
    <p-menu #catalogMenu [popup]="true" [model]="catalogItems" appendTo="body" />
    @if (auth.hasRole('ADMIN')) {
      <a
        routerLink="/admin/users"
        routerLinkActive="active-link"
        pButton
        class="nav-link"
        [text]="true"
        label="Пользователи"
      ></a>
      <p-button
        type="button"
        label="+ Пользователь"
        icon="pi pi-user-plus"
        [text]="true"
        (onClick)="adminUserDialogVisible = true"
      />
    }
  </ng-template>
  <ng-template pTemplate="end">
    @if (auth.username(); as u) {
      <span class="user-label">{{ u }}</span>
    }
    <p-button
      type="button"
      label="Выход"
      [text]="true"
      severity="secondary"
      (onClick)="auth.logout()"
    />
  </ng-template>
</p-toolbar>

<main class="shell-main">
  <router-outlet />
</main>

<app-user-create-dialog [(visible)]="adminUserDialogVisible" />
