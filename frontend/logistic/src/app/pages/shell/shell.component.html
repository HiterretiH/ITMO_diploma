<p-toolbar styleClass="shell-toolbar">
  <ng-template #start>
    <a
      routerLink="/orders"
      class="shell-home"
      tabindex="0"
      aria-label="К списку рейсов"
      title="К списку рейсов"
    >
      <i class="pi pi-home" aria-hidden="true"></i>
    </a>
    <a
      routerLink="/orders"
      [class.active-link]="ordersListNavActive()"
      pButton
      class="nav-link"
      [text]="true"
      label="Рейсы"
    ></a>
    <a
      routerLink="/orders/new"
      [class.active-link]="createTripNavActive()"
      pButton
      class="nav-link"
      [text]="true"
      label="Создать рейс"
    ></a>
    <p-button
      type="button"
      label="Каталоги"
      icon="pi pi-angle-down"
      [text]="true"
      aria-label="Каталоги: заказчики, исполнители, водители, транспорт"
      title="Заказчики, исполнители, водители, транспорт"
      (onClick)="catalogMenu.toggle($event)"
    />
    <p-menu #catalogMenu [popup]="true" [model]="catalogItems" appendTo="body" />
    @if (auth.hasRole('ADMIN')) {
      <a
        routerLink="/admin/users"
        routerLinkActive="active-link"
        pButton
        class="nav-link"
        [text]="true"
        label="Пользователи"
      ></a>
      <p-button
        type="button"
        label="+ Пользователь"
        icon="pi pi-user-plus"
        [text]="true"
        (onClick)="adminUserDialogVisible = true"
      />
    }
  </ng-template>
  <ng-template #end>
    <p-button
      type="button"
      [icon]="themeIcon()"
      [text]="true"
      rounded="true"
      severity="secondary"
      aria-label="Переключить светлую или тёмную тему"
      title="Тема: светлая или тёмная (нажмите для переключения)"
      (onClick)="cycleTheme()"
    />
    <a
      routerLink="/account"
      routerLinkActive="active-link"
      pButton
      class="nav-link"
      [text]="true"
      label="Личный кабинет"
    ></a>
    <p-button
      type="button"
      label="Выход"
      [text]="true"
      severity="secondary"
      (onClick)="auth.logout()"
    />
  </ng-template>
</p-toolbar>

<main class="shell-main">
  <router-outlet />
</main>

<app-user-create-dialog [(visible)]="adminUserDialogVisible" />
