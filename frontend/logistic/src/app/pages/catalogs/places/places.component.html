<div class="page-head">
  <h1 class="page-title">Места</h1>
  <p-button type="button" label="Добавить" icon="pi pi-plus" (onClick)="openCreate()" />
</div>

<p-table [value]="items" [tableStyle]="{ 'min-width': '44rem' }" styleClass="p-datatable-sm">
  <ng-template pTemplate="header">
    <tr>
      <th>Адрес</th>
      <th>Контакт</th>
      <th>Тип</th>
      <th style="width: 8rem"></th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-row>
    <tr>
      <td>{{ row.address }}</td>
      <td>{{ row.contact || '—' }}</td>
      <td>{{ typeLabel(row.placeType) }}</td>
      <td>
        <p-button
          label="Изменить"
          icon="pi pi-pencil"
          [text]="true"
          severity="secondary"
          (onClick)="openEdit(row)"
        />
        <p-button
          label="Удалить"
          icon="pi pi-trash"
          [text]="true"
          severity="danger"
          (onClick)="confirmDelete(row)"
        />
      </td>
    </tr>
  </ng-template>
  <ng-template pTemplate="emptymessage">
    <tr>
      <td colspan="4">Нет данных</td>
    </tr>
  </ng-template>
</p-table>

<p-dialog
  [header]="dialogHeader()"
  [(visible)]="dialogVisible"
  [modal]="true"
  [style]="{ width: '26rem' }"
  [draggable]="false"
>
  <form [formGroup]="form" (ngSubmit)="save()">
    <div class="field">
      <label for="pl-addr">Адрес *</label>
      <input pInputText id="pl-addr" formControlName="address" class="w-full" />
      @if (form.controls.address.touched && form.controls.address.invalid) {
        <small class="p-error">Обязательное поле</small>
      }
    </div>
    <div class="field">
      <label for="pl-ct">Контакт</label>
      <input pInputText id="pl-ct" formControlName="contact" class="w-full" />
    </div>
    <div class="field">
      <label for="pl-type">Тип *</label>
      <p-dropdown
        inputId="pl-type"
        formControlName="placeType"
        [options]="typeOptions"
        optionLabel="label"
        optionValue="value"
        appendTo="body"
        styleClass="w-full"
      />
    </div>
  </form>
  <ng-template pTemplate="footer">
    <p-button label="Отмена" [text]="true" (onClick)="dialogVisible = false" />
    <p-button
      label="Сохранить"
      [loading]="saving"
      [disabled]="form.invalid || saving"
      (onClick)="save()"
    />
  </ng-template>
</p-dialog>
