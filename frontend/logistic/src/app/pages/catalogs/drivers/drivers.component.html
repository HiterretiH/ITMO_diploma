<app-driver-catalog-dialog #catalogDlg [performers]="performers" (saved)="reload()" />

<div class="page-head">
  <h1 class="page-title">Водители</h1>
  <p-button type="button" label="Добавить" icon="pi pi-plus" (onClick)="catalogDlg.openCreate()" />
</div>

<p-table [value]="items" [tableStyle]="{ 'min-width': '44rem' }" styleClass="p-datatable-sm">
  <ng-template pTemplate="header">
    <tr>
      <th>Исполнитель</th>
      <th>ФИО</th>
      <th>Телефон</th>
      <th style="width: 8rem"></th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-row>
    <tr>
      <td>{{ performerLabel(row.performerId) }}</td>
      <td>{{ row.fullName }}</td>
      <td>{{ row.phone || '—' }}</td>
      <td>
        <p-button
          label="Изменить"
          icon="pi pi-pencil"
          [text]="true"
          severity="secondary"
          (onClick)="catalogDlg.openEdit(row)"
        />
        <p-button
          label="Удалить"
          icon="pi pi-trash"
          [text]="true"
          severity="danger"
          (onClick)="confirmDelete(row)"
        />
      </td>
    </tr>
  </ng-template>
  <ng-template pTemplate="emptymessage">
    <tr>
      <td colspan="4">
        <div class="catalog-empty-state">
          <i class="pi pi-inbox" aria-hidden="true"></i>
          <p>Водителей пока нет</p>
          <p-button
            type="button"
            label="Добавить первого"
            icon="pi pi-plus"
            size="small"
            (onClick)="catalogDlg.openCreate()"
          />
        </div>
      </td>
    </tr>
  </ng-template>
</p-table>
