<div class="guest-page">
  <app-guest-header [showLoginLink]="false" [showRegisterLink]="true" />
  <div class="login-wrap">
    <p-card header="Вход">
    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="field">
        <label for="login-user">Логин</label>
        <input
          pInputText
          id="login-user"
          type="text"
          formControlName="username"
          autocomplete="username"
          class="w-full"
        />
        @if (form.controls.username.touched && form.controls.username.invalid) {
          <small class="p-error">Укажите логин</small>
        }
      </div>
      <div class="field">
        <label for="login-pass">Пароль</label>
        <p-password
          inputId="login-pass"
          formControlName="password"
          [feedback]="false"
          [toggleMask]="true"
          styleClass="w-full"
          inputStyleClass="w-full"
          [fluid]="true"
          autocomplete="current-password"
        />
        @if (form.controls.password.touched && form.controls.password.invalid) {
          <small class="p-error">Укажите пароль</small>
        }
      </div>
      <p-button
        type="submit"
        label="Войти"
        [disabled]="busy || form.invalid"
        [loading]="busy"
        styleClass="w-full"
      />
    </form>
  </p-card>
  </div>
</div>
