<div class="trip-new-wrap">
  <header class="page-head">
    <h1 class="page-title">{{ isEditMode ? 'Редактирование рейса' : 'Новый рейс' }}</h1>
    <p-button
      label="К списку"
      icon="pi pi-arrow-left"
      severity="secondary"
      [text]="true"
      routerLink="/orders"
    />
  </header>

  <p-card>
    @if (errorMessage) {
      <p-message
        severity="error"
        [text]="errorMessage"
        [closable]="true"
        (onClose)="errorMessage = null"
        styleClass="msg-banner w-full"
      />
    }

    <app-order-catalog-dialogs
      #catalogDialogs
      [form]="form"
      (catalogSaved)="onCatalogSaved()"
      (catalogHint)="errorMessage = $event"
    />

    <form [formGroup]="form" class="trip-new-form" (ngSubmit)="saveDraft()">
      <section class="catalog-block surface-panel surface-panel--compact" aria-labelledby="sec-customer">
        <h2 id="sec-customer" class="section-title">
          <i class="pi pi-users" aria-hidden="true"></i>
          Заказчик и исполнитель
        </h2>
        <app-trip-form-field
          [control]="form.controls.customerId"
          label="Заказчик"
          htmlFor="cust"
          errorDomId="trip-err-customerId"
        >
          <p-dropdown
            inputId="cust"
            formControlName="customerId"
            [options]="customerOptions()"
            optionLabel="label"
            optionValue="value"
            [filter]="true"
            filterBy="label"
            emptyFilterMessage="Ничего не найдено"
            emptyMessage="Нет записей"
            [showClear]="true"
            [placeholder]="customers.length ? '—' : 'Нет заказчиков'"
            appendTo="body"
            styleClass="w-full"
            [attr.aria-describedby]="
              fieldAriaDescribedBy('trip-err-customerId', form.controls.customerId)
            "
          />
          <div class="field-actions catalog-row-actions trip-field-actions">
            <p-button
              type="button"
              label="Добавить…"
              severity="secondary"
              [outlined]="true"
              size="small"
              (onClick)="catalogDialogs.openCustomerCreate()"
            />
            <span
              pTooltip="Сначала выберите заказчика в списке"
              tooltipPosition="top"
              [tooltipDisabled]="customerSelected()"
            >
              <p-button
                type="button"
                label="Изменить"
                [text]="true"
                styleClass="p-0"
                icon="pi pi-pencil"
                [disabled]="!customerSelected()"
                (onClick)="catalogDialogs.openCustomerEdit(customers)"
              />
            </span>
          </div>
        </app-trip-form-field>
        <app-trip-form-field
          [control]="form.controls.performerId"
          label="Исполнитель"
          htmlFor="perf"
          errorDomId="trip-err-performerId"
        >
          <p-dropdown
            inputId="perf"
            formControlName="performerId"
            [options]="performerOptions()"
            optionLabel="label"
            optionValue="value"
            [filter]="true"
            filterBy="label"
            emptyFilterMessage="Ничего не найдено"
            emptyMessage="Нет записей"
            [showClear]="true"
            [placeholder]="performers.length ? '—' : 'Нет исполнителей'"
            appendTo="body"
            styleClass="w-full"
            [attr.aria-describedby]="
              fieldAriaDescribedBy('trip-err-performerId', form.controls.performerId)
            "
          />
          <div class="field-actions catalog-row-actions trip-field-actions">
            <p-button
              type="button"
              label="Добавить…"
              severity="secondary"
              [outlined]="true"
              size="small"
              (onClick)="catalogDialogs.openPerformerCreate()"
            />
            <span
              pTooltip="Сначала выберите исполнителя в списке"
              tooltipPosition="top"
              [tooltipDisabled]="performerSelected()"
            >
              <p-button
                type="button"
                label="Изменить"
                [text]="true"
                styleClass="p-0"
                icon="pi pi-pencil"
                [disabled]="!performerSelected()"
                (onClick)="catalogDialogs.openPerformerEdit(performers)"
              />
            </span>
          </div>
        </app-trip-form-field>
      </section>

      <p-divider />

      <section class="catalog-block surface-panel surface-panel--compact" aria-labelledby="sec-performer">
        <h2 id="sec-performer" class="section-title">
          <i class="pi pi-truck" aria-hidden="true"></i>
          Транспорт
        </h2>
        <div class="grid-2">
          <app-trip-form-field
            [control]="form.controls.driverId"
            label="Водитель"
            htmlFor="driver"
            errorDomId="trip-err-driverId"
          >
            <p-dropdown
              inputId="driver"
              formControlName="driverId"
              [options]="driverOptions()"
              optionLabel="label"
              optionValue="value"
              [filter]="true"
              filterBy="label"
              emptyFilterMessage="Ничего не найдено"
              emptyMessage="Нет записей"
              [showClear]="true"
              [placeholder]="driverOptions().length ? '—' : 'Нет водителей'"
              appendTo="body"
              styleClass="w-full"
              [attr.aria-describedby]="
                fieldAriaDescribedBy('trip-err-driverId', form.controls.driverId)
              "
            />
            <div class="field-actions catalog-row-actions trip-field-actions">
              <p-button
                type="button"
                label="Добавить…"
                severity="secondary"
                [outlined]="true"
                size="small"
                (onClick)="catalogDialogs.openDriverCreate()"
              />
              <span
                pTooltip="Сначала выберите водителя в списке"
                tooltipPosition="top"
                [tooltipDisabled]="driverSelected()"
              >
                <p-button
                  type="button"
                  label="Изменить"
                  [text]="true"
                  styleClass="p-0"
                  icon="pi pi-pencil"
                  [disabled]="!driverSelected()"
                  (onClick)="catalogDialogs.openDriverEdit(drivers)"
                />
              </span>
            </div>
          </app-trip-form-field>
          <app-trip-form-field
            [control]="form.controls.vehicleId"
            label="Транспорт"
            htmlFor="vehicle"
            errorDomId="trip-err-vehicleId"
          >
            <p-dropdown
              inputId="vehicle"
              formControlName="vehicleId"
              [options]="vehicleOptions()"
              optionLabel="label"
              optionValue="value"
              [filter]="true"
              filterBy="label"
              emptyFilterMessage="Ничего не найдено"
              emptyMessage="Нет записей"
              [showClear]="true"
              [placeholder]="vehicleOptions().length ? '—' : 'Нет ТС'"
              appendTo="body"
              styleClass="w-full"
              [attr.aria-describedby]="
                fieldAriaDescribedBy('trip-err-vehicleId', form.controls.vehicleId)
              "
            />
            <div class="field-actions catalog-row-actions trip-field-actions">
              <p-button
                type="button"
                label="Добавить…"
                severity="secondary"
                [outlined]="true"
                size="small"
                (onClick)="catalogDialogs.openVehicleCreate()"
              />
              <span
                pTooltip="Сначала выберите транспорт в списке"
                tooltipPosition="top"
                [tooltipDisabled]="vehicleSelected()"
              >
                <p-button
                  type="button"
                  label="Изменить"
                  [text]="true"
                  styleClass="p-0"
                  icon="pi pi-pencil"
                  [disabled]="!vehicleSelected()"
                  (onClick)="catalogDialogs.openVehicleEdit(vehicles)"
                />
              </span>
            </div>
          </app-trip-form-field>
        </div>
      </section>

      <p-divider />

      <section class="block" aria-labelledby="sec-route">
        <h2 id="sec-route" class="section-title">Маршрут</h2>
        <app-trip-form-field
          [control]="form.controls.loadingPlace"
          label="Погрузка (адрес)"
          htmlFor="loadPl"
          errorDomId="trip-err-loadingPlace"
        >
          <textarea
            pInputTextarea
            id="loadPl"
            formControlName="loadingPlace"
            rows="3"
            class="w-full"
            [attr.aria-describedby]="
              fieldAriaDescribedBy('trip-err-loadingPlace', form.controls.loadingPlace)
            "
          ></textarea>
        </app-trip-form-field>
        <div class="field">
          <label for="loadCt">Контакт на погрузке</label>
          <input pInputText id="loadCt" formControlName="loadingContact" class="w-full" />
        </div>
        <app-trip-form-field
          [control]="form.controls.unloadingPlace"
          label="Выгрузка (адрес)"
          htmlFor="unlPl"
          errorDomId="trip-err-unloadingPlace"
        >
          <textarea
            pInputTextarea
            id="unlPl"
            formControlName="unloadingPlace"
            rows="3"
            class="w-full"
            [attr.aria-describedby]="
              fieldAriaDescribedBy('trip-err-unloadingPlace', form.controls.unloadingPlace)
            "
          ></textarea>
        </app-trip-form-field>
        <div class="field">
          <label for="unlCt">Контакт на выгрузке</label>
          <input pInputText id="unlCt" formControlName="unloadingContact" class="w-full" />
        </div>
      </section>

      <p-divider />

      <section class="block" aria-labelledby="sec-date">
        <h2 id="sec-date" class="section-title">Дата и номер</h2>
        <app-trip-form-field
          [control]="form.controls.orderDate"
          label="Дата заявки"
          htmlFor="loadD"
          errorDomId="trip-err-orderDate"
        >
          <p-datepicker
            inputId="loadD"
            formControlName="orderDate"
            dateFormat="yy-mm-dd"
            [showIcon]="true"
            appendTo="body"
            styleClass="w-full"
            [attr.aria-describedby]="
              fieldAriaDescribedBy('trip-err-orderDate', form.controls.orderDate)
            "
          />
        </app-trip-form-field>
        <div class="field">
          <label for="ordNumNew">Номер заявки</label>
          <p-inputNumber
            inputId="ordNumNew"
            formControlName="orderNumber"
            [min]="1"
            [useGrouping]="false"
            placeholder="—"
            styleClass="w-full"
          />
        </div>
      </section>

      <p-divider />

      <section class="block" aria-labelledby="sec-money">
        <h2 id="sec-money" class="section-title">Оплата</h2>
        <div class="grid-money">
          <app-trip-form-field
            [control]="form.controls.ratePerLeg"
            label="Ставка за рейс"
            htmlFor="rate"
            errorDomId="trip-err-ratePerLeg"
            [errorText]="ratePerLegErrorText()"
          >
            <p-inputNumber
              inputId="rate"
              formControlName="ratePerLeg"
              [min]="0"
              mode="decimal"
              [minFractionDigits]="0"
              [maxFractionDigits]="2"
              suffix=" ₽"
              placeholder="0"
              styleClass="w-full"
              [attr.aria-describedby]="
                fieldAriaDescribedBy('trip-err-ratePerLeg', form.controls.ratePerLeg)
              "
            />
          </app-trip-form-field>
          <app-trip-form-field
            [control]="form.controls.legCount"
            label="Число перевозок"
            htmlFor="legCount"
            errorDomId="trip-err-legCount"
            [errorText]="legCountErrorText()"
          >
            <p-inputNumber
              inputId="legCount"
              formControlName="legCount"
              [min]="1"
              [useGrouping]="false"
              placeholder="1"
              styleClass="w-full"
              [attr.aria-describedby]="
                fieldAriaDescribedBy('trip-err-legCount', form.controls.legCount)
              "
            />
          </app-trip-form-field>
          <app-trip-form-field
            [control]="form.controls.priceAmount"
            label="Итого, ₽"
            htmlFor="priceAmount"
            errorDomId="trip-err-priceAmount"
            [errorText]="priceAmountErrorText()"
            class="total-field"
          >
            <p-inputNumber
              inputId="priceAmount"
              formControlName="priceAmount"
              [min]="0"
              mode="decimal"
              [minFractionDigits]="0"
              [maxFractionDigits]="2"
              suffix=" ₽"
              placeholder="0"
              styleClass="w-full"
              [attr.aria-describedby]="
                fieldAriaDescribedBy('trip-err-priceAmount', form.controls.priceAmount)
              "
            />
          </app-trip-form-field>
        </div>
      </section>

      <div class="form-footer">
        <p-button
          type="button"
          label="Отмена"
          severity="secondary"
          [outlined]="true"
          routerLink="/orders"
        />
        <p-button
          type="submit"
          [label]="isEditMode ? 'Сохранить' : 'Создать рейс'"
          icon="pi pi-check"
          severity="success"
          [loading]="busy"
          [disabled]="busy"
        />
      </div>
    </form>
  </p-card>
</div>
