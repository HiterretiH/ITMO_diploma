<div class="trip-new-wrap">
  <header class="page-head">
    <h1 class="page-title">Новый рейс</h1>
    <p-button
      label="К списку"
      icon="pi pi-arrow-left"
      severity="secondary"
      [text]="true"
      routerLink="/orders"
    />
  </header>

  <p-card>
    @if (errorMessage) {
      <p-message
        severity="error"
        [text]="errorMessage"
        [closable]="true"
        (onClose)="errorMessage = null"
        styleClass="msg-banner w-full"
      />
    }

    <app-order-catalog-dialogs
      #catalogDialogs
      [form]="form"
      (catalogSaved)="onCatalogSaved()"
      (catalogHint)="errorMessage = $event"
    />

    <form [formGroup]="form" class="trip-new-form" (ngSubmit)="saveAndComplete()">
      <section class="block" aria-labelledby="sec-customer">
        <h2 id="sec-customer" class="block-heading">Заказчик и исполнитель</h2>
        <div class="field">
          <label for="cust">Заказчик</label>
          <p-dropdown
            inputId="cust"
            formControlName="customerId"
            [options]="customerOptions()"
            optionLabel="label"
            optionValue="value"
            [filter]="true"
            filterBy="label"
            [showClear]="true"
            [placeholder]="customers.length ? '—' : 'Нет заказчиков'"
            appendTo="body"
            styleClass="w-full"
          />
          <div class="catalog-row-actions">
            <p-button
              type="button"
              label="Добавить…"
              severity="secondary"
              [outlined]="true"
              size="small"
              (onClick)="catalogDialogs.openCustomerCreate()"
            />
            <p-button
              type="button"
              label="Изменить"
              [text]="true"
              styleClass="p-0"
              [disabled]="!customerSelected()"
              (onClick)="catalogDialogs.openCustomerEdit(customers)"
            />
          </div>
        </div>
        <div class="field">
          <label for="perf">Исполнитель</label>
          <p-dropdown
            inputId="perf"
            formControlName="performerId"
            [options]="performerOptions()"
            optionLabel="label"
            optionValue="value"
            [filter]="true"
            filterBy="label"
            [showClear]="true"
            [placeholder]="performers.length ? '—' : 'Нет исполнителей'"
            appendTo="body"
            styleClass="w-full"
          />
          <div class="catalog-row-actions">
            <p-button
              type="button"
              label="Добавить…"
              severity="secondary"
              [outlined]="true"
              size="small"
              (onClick)="catalogDialogs.openPerformerCreate()"
            />
            <p-button
              type="button"
              label="Изменить"
              [text]="true"
              styleClass="p-0"
              [disabled]="!performerSelected()"
              (onClick)="catalogDialogs.openPerformerEdit(performers)"
            />
          </div>
        </div>
      </section>

      <p-divider />

      <section class="block" aria-labelledby="sec-performer">
        <h2 id="sec-performer" class="block-heading">Транспорт</h2>
        <div class="grid-2">
          <div class="field">
            <label for="driver">Водитель</label>
            <p-dropdown
              inputId="driver"
              formControlName="driverId"
              [options]="driverOptions()"
              optionLabel="label"
              optionValue="value"
              [filter]="true"
              filterBy="label"
              [showClear]="true"
              [placeholder]="driverOptions().length ? '—' : 'Нет водителей'"
              appendTo="body"
              styleClass="w-full"
            />
            <div class="catalog-row-actions">
              <p-button
                type="button"
                label="Добавить…"
                severity="secondary"
                [outlined]="true"
                size="small"
                (onClick)="catalogDialogs.openDriverCreate()"
              />
              <p-button
                type="button"
                label="Изменить"
                [text]="true"
                styleClass="p-0"
                [disabled]="!driverSelected()"
                (onClick)="catalogDialogs.openDriverEdit(drivers)"
              />
            </div>
          </div>
          <div class="field">
            <label for="vehicle">Транспорт</label>
            <p-dropdown
              inputId="vehicle"
              formControlName="vehicleId"
              [options]="vehicleOptions()"
              optionLabel="label"
              optionValue="value"
              [filter]="true"
              filterBy="label"
              [showClear]="true"
              [placeholder]="vehicleOptions().length ? '—' : 'Нет ТС'"
              appendTo="body"
              styleClass="w-full"
            />
            <div class="catalog-row-actions">
              <p-button
                type="button"
                label="Добавить…"
                severity="secondary"
                [outlined]="true"
                size="small"
                (onClick)="catalogDialogs.openVehicleCreate()"
              />
              <p-button
                type="button"
                label="Изменить"
                [text]="true"
                styleClass="p-0"
                [disabled]="!vehicleSelected()"
                (onClick)="catalogDialogs.openVehicleEdit(vehicles)"
              />
            </div>
          </div>
        </div>
      </section>

      <p-divider />

      <section class="block" aria-labelledby="sec-route">
        <h2 id="sec-route" class="block-heading">Маршрут</h2>
        <div class="field">
          <label for="loadPl">Погрузка (адрес)</label>
          <textarea
            pInputTextarea
            id="loadPl"
            formControlName="loadingPlace"
            rows="3"
            class="w-full"
          ></textarea>
        </div>
        <div class="field">
          <label for="loadCt">Контакт на погрузке</label>
          <input pInputText id="loadCt" formControlName="loadingContact" class="w-full" />
        </div>
        <div class="field">
          <label for="unlPl">Выгрузка (адрес)</label>
          <textarea
            pInputTextarea
            id="unlPl"
            formControlName="unloadingPlace"
            rows="3"
            class="w-full"
          ></textarea>
        </div>
        <div class="field">
          <label for="unlCt">Контакт на выгрузке</label>
          <input pInputText id="unlCt" formControlName="unloadingContact" class="w-full" />
        </div>
      </section>

      <p-divider />

      <section class="block" aria-labelledby="sec-date">
        <h2 id="sec-date" class="block-heading">Дата и номер</h2>
        <div class="field">
          <label for="loadD">Дата заявки</label>
          <p-datepicker
            inputId="loadD"
            formControlName="orderDate"
            dateFormat="yy-mm-dd"
            [showIcon]="true"
            appendTo="body"
            styleClass="w-full"
          />
        </div>
        <div class="field">
          <label for="ordNumNew">Номер заявки</label>
          <p-inputNumber
            inputId="ordNumNew"
            formControlName="orderNumber"
            [min]="1"
            [useGrouping]="false"
            placeholder="—"
            styleClass="w-full"
          />
          <p class="field-hint">
            Подставляется следующий свободный номер; при необходимости измените до сохранения.
          </p>
        </div>
      </section>

      <p-divider />

      <section class="block" aria-labelledby="sec-money">
        <h2 id="sec-money" class="block-heading">Оплата</h2>
        <div class="grid-money">
          <div class="field">
            <label for="rate">Ставка за рейс</label>
            <p-inputNumber
              inputId="rate"
              formControlName="ratePerLeg"
              [min]="0"
              mode="decimal"
              [minFractionDigits]="0"
              [maxFractionDigits]="2"
              suffix=" ₽"
              placeholder="0"
              styleClass="w-full"
            />
          </div>
          <div class="field">
            <label for="legCount">Число перевозок</label>
            <p-inputNumber
              inputId="legCount"
              formControlName="legCount"
              [min]="1"
              [useGrouping]="false"
              placeholder="1"
              styleClass="w-full"
            />
          </div>
          <div class="field total-field">
            <label for="priceAmount">Итого, ₽</label>
            <p-inputNumber
              inputId="priceAmount"
              formControlName="priceAmount"
              [min]="0"
              mode="decimal"
              [minFractionDigits]="0"
              [maxFractionDigits]="2"
              suffix=" ₽"
              placeholder="0"
              styleClass="w-full"
            />
            <p class="field-hint">
              Пересчитывается как ставка × число перевозок; можно изменить вручную.
            </p>
          </div>
        </div>
      </section>

      <div class="form-footer">
        <p-button
          type="button"
          label="Отмена"
          severity="secondary"
          [outlined]="true"
          routerLink="/orders"
        />
        <p-button
          type="submit"
          label="Создать и завершить рейс"
          icon="pi pi-check"
          [loading]="busy"
          [disabled]="busy"
        />
      </div>
    </form>
  </p-card>
</div>
