<div class="trip-new-wrap">
  <header class="page-head">
    <h1 class="page-title">Новый заказ</h1>
    <p-button
      label="К списку"
      icon="pi pi-arrow-left"
      severity="secondary"
      [text]="true"
      routerLink="/orders"
    />
  </header>

  <p-card>
    @if (errorMessage) {
      <p-message
        severity="error"
        [text]="errorMessage"
        [closable]="true"
        (onClose)="errorMessage = null"
        styleClass="msg-banner w-full"
      />
    }

    <form [formGroup]="form" class="trip-new-form" (ngSubmit)="saveAndComplete()">
      <section class="block" aria-labelledby="sec-customer">
        <h2 id="sec-customer" class="block-heading">Заказчик и исполнитель</h2>
        <div class="field">
          <label for="cust">Заказчик</label>
          <p-dropdown
            inputId="cust"
            formControlName="customerId"
            [options]="customerOptions()"
            optionLabel="label"
            optionValue="value"
            [showClear]="true"
            appendTo="body"
            styleClass="w-full"
          />
        </div>
        <div class="field">
          <label for="perf">Исполнитель</label>
          <p-dropdown
            inputId="perf"
            formControlName="performerId"
            [options]="performerOptions()"
            optionLabel="label"
            optionValue="value"
            [showClear]="true"
            appendTo="body"
            styleClass="w-full"
          />
        </div>
      </section>

      <p-divider />

      <section class="block" aria-labelledby="sec-route">
        <h2 id="sec-route" class="block-heading">Маршрут</h2>
        <div class="field">
          <label for="loadPl">Погрузка (адрес)</label>
          <textarea
            pInputTextarea
            id="loadPl"
            formControlName="loadingPlace"
            rows="3"
            class="w-full"
          ></textarea>
        </div>
        <div class="field">
          <label for="loadCt">Контакт на погрузке</label>
          <input pInputText id="loadCt" formControlName="loadingContact" class="w-full" />
        </div>
        <div class="field">
          <label for="unlPl">Выгрузка (адрес)</label>
          <textarea
            pInputTextarea
            id="unlPl"
            formControlName="unloadingPlace"
            rows="3"
            class="w-full"
          ></textarea>
        </div>
        <div class="field">
          <label for="unlCt">Контакт на выгрузке</label>
          <input pInputText id="unlCt" formControlName="unloadingContact" class="w-full" />
        </div>
      </section>

      <p-divider />

      <section class="block" aria-labelledby="sec-date">
        <h2 id="sec-date" class="block-heading">Дата</h2>
        <div class="field">
          <label for="loadD">Дата заявки</label>
          <p-datepicker
            inputId="loadD"
            formControlName="orderDate"
            dateFormat="yy-mm-dd"
            [showIcon]="true"
            appendTo="body"
            styleClass="w-full"
          />
        </div>
      </section>

      <p-divider />

      <section class="block" aria-labelledby="sec-performer">
        <h2 id="sec-performer" class="block-heading">Транспорт</h2>
        <div class="grid-2">
          <div class="field">
            <label for="driver">Водитель</label>
            <p-dropdown
              inputId="driver"
              formControlName="driverId"
              [options]="driverOptions()"
              optionLabel="label"
              optionValue="value"
              [showClear]="true"
              appendTo="body"
              styleClass="w-full"
            />
          </div>
          <div class="field">
            <label for="vehicle">Транспорт</label>
            <p-dropdown
              inputId="vehicle"
              formControlName="vehicleId"
              [options]="vehicleOptions()"
              optionLabel="label"
              optionValue="value"
              [showClear]="true"
              appendTo="body"
              styleClass="w-full"
            />
          </div>
        </div>
      </section>

      <p-divider />

      <section class="block" aria-labelledby="sec-money">
        <h2 id="sec-money" class="block-heading">Оплата</h2>
        <div class="grid-money">
          <div class="field">
            <label for="rate">Ставка за рейс</label>
            <p-inputNumber
              inputId="rate"
              formControlName="ratePerLeg"
              [min]="0"
              mode="decimal"
              [minFractionDigits]="0"
              [maxFractionDigits]="2"
              suffix=" ₽"
              styleClass="w-full"
            />
          </div>
          <div class="field">
            <label for="legCount">Число перевозок</label>
            <p-inputNumber
              inputId="legCount"
              formControlName="legCount"
              [min]="1"
              [useGrouping]="false"
              styleClass="w-full"
            />
          </div>
          <div class="field total-field">
            <label for="priceAmount">Итого, ₽</label>
            <p-inputNumber
              inputId="priceAmount"
              formControlName="priceAmount"
              [min]="0"
              mode="decimal"
              [minFractionDigits]="0"
              [maxFractionDigits]="2"
              suffix=" ₽"
              styleClass="w-full"
            />
            <p class="field-hint">
              Пересчитывается как ставка × число перевозок; можно изменить вручную.
            </p>
          </div>
        </div>
      </section>

      <div class="form-footer">
        <p-button
          type="button"
          label="Отмена"
          severity="secondary"
          [outlined]="true"
          routerLink="/orders"
        />
        <p-button
          type="submit"
          label="Создать и завершить заказ"
          icon="pi pi-check"
          [loading]="busy"
          [disabled]="busy"
        />
      </div>
    </form>
  </p-card>
</div>
