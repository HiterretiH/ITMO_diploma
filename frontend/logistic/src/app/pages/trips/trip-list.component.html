<div class="head">
  <h1 class="page-title">Рейсы</h1>
  <p-button label="Создать" icon="pi pi-plus" routerLink="/orders/new" />
</div>

<p-tabs [value]="listTab" (valueChange)="onListTabChange($event)">
  <p-tablist>
    <p-tab value="active">В работе</p-tab>
    <p-tab value="done">Завершённые</p-tab>
  </p-tablist>
  <p-tabpanels>
    <p-tabpanel value="active">
      <p class="tab-desc">{{ tabSubtitle() }}</p>
      <ng-container *ngTemplateOutlet="ordersTable" />
    </p-tabpanel>
    <p-tabpanel value="done">
      <p class="tab-desc">{{ tabSubtitle() }}</p>
      <ng-container *ngTemplateOutlet="ordersTable" />
    </p-tabpanel>
  </p-tabpanels>
</p-tabs>

<ng-template #ordersTable>
  <p-table
    [value]="tabOrders"
    [tableStyle]="{ 'min-width': '52rem' }"
    styleClass="p-datatable-sm"
  >
    <ng-template pTemplate="header">
      <tr>
        <th>№ заявки</th>
        <th>Дата</th>
        <th>Заказчик</th>
        <th>Маршрут</th>
        @if (listTab === 'active') {
          <th class="col-actions"></th>
        }
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-o>
      <tr class="click-row" (click)="openOrder(o.id)">
        <td class="order-num-cell">{{ o.orderNumber }}</td>
        <td>{{ o.orderDate }}</td>
        <td>{{ o.customerShortName || '—' }}</td>
        <td class="route-cell">{{ routeSnippet(o) }}</td>
        @if (listTab === 'active') {
          <td class="col-actions" (click)="$event.stopPropagation()">
            @if (canCompleteRow(o)) {
              <p-button
                label="Завершить рейс"
                icon="pi pi-check"
                severity="success"
                size="small"
                [loading]="completingOrderId === o.id"
                [disabled]="
                  completingOrderId !== null && completingOrderId !== o.id
                "
                (onClick)="completeOrder(o)"
              />
            }
          </td>
        }
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td [attr.colspan]="listTab === 'active' ? 5 : 4">
          Нет рейсов
        </td>
      </tr>
    </ng-template>
  </p-table>
</ng-template>
