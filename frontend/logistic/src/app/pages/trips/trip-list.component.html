<div class="head">
  <h1 class="title">Рейсы</h1>
  <p-button label="Создать" icon="pi pi-plus" routerLink="/trips/new" />
</div>

<div class="toolbar">
  <label class="filter-label" for="trip-status-filter">Статус</label>
  <p-dropdown
    inputId="trip-status-filter"
    [options]="statusOptions"
    [(ngModel)]="filter"
    optionLabel="label"
    optionValue="value"
    placeholder="Все"
    [showClear]="true"
    (onChange)="reload()"
    styleClass="minw-14rem"
  />
</div>

<p-table [value]="trips" [tableStyle]="{ 'min-width': '44rem' }" styleClass="p-datatable-sm">
  <ng-template pTemplate="header">
    <tr>
      <th>№</th>
      <th>Статус</th>
      <th>Владелец</th>
      <th>Обновлён</th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-t>
    <tr class="click-row" (click)="openTrip(t.id)">
      <td>
        <a [routerLink]="['/trips', t.id]" (click)="$event.stopPropagation()">{{ t.id }}</a>
      </td>
      <td>
        <app-trip-status-badge [status]="t.status" />
      </td>
      <td>{{ t.ownerUsername }}</td>
      <td>{{ t.updatedAt | date: 'short' }}</td>
    </tr>
  </ng-template>
  <ng-template pTemplate="emptymessage">
    <tr>
      <td colspan="4">Нет рейсов</td>
    </tr>
  </ng-template>
</p-table>
