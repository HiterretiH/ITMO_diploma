<h1 class="page-title">Заявки на регистрацию</h1>

<p-table
  [value]="rows()"
  [loading]="loading()"
  [rowHover]="true"
  styleClass="p-datatable-sm"
>
  <ng-template pTemplate="header">
    <tr>
      <th>Логин</th>
      <th>Статус</th>
      <th style="width: 14rem">Действия</th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-row>
    <tr>
      <td>{{ row.username }}</td>
      <td>
        <p-tag
          [value]="statusLabel(row.registrationStatus)"
          [severity]="statusSeverity(row.registrationStatus)"
        />
      </td>
      <td class="actions">
        <p-button
          type="button"
          label="Подтвердить"
          icon="pi pi-check"
          size="small"
          [loading]="isBusy(row.id)"
          (onClick)="approve(row)"
        />
        @if (row.registrationStatus === 'PENDING') {
          <p-button
            type="button"
            label="Отклонить"
            icon="pi pi-times"
            size="small"
            severity="danger"
            [text]="true"
            [loading]="isBusy(row.id)"
            (onClick)="reject(row)"
          />
        }
      </td>
    </tr>
  </ng-template>
  <ng-template pTemplate="emptymessage">
    <tr>
      <td colspan="3">Нет заявок на регистрацию</td>
    </tr>
  </ng-template>
</p-table>
