<p-dialog
  [header]="customerEditingId != null ? 'Изменить заказчика' : 'Новый заказчик'"
  [(visible)]="customerDialogVisible"
  [modal]="true"
  [style]="{ width: '26rem' }"
  [draggable]="false"
>
  <form [formGroup]="customerForm">
    <div class="field">
      <label for="ocd-cn">Краткое название *</label>
      <input pInputText id="ocd-cn" formControlName="shortName" class="w-full" />
    </div>
    <div class="field">
      <label for="ocd-cf">Полное название</label>
      <input pInputText id="ocd-cf" formControlName="fullName" class="w-full" />
    </div>
    <div class="field">
      <label for="ocd-cph">Телефон</label>
      <input pInputText id="ocd-cph" formControlName="phone" class="w-full" />
    </div>
    <div class="field">
      <label for="ocd-cr">Реквизиты</label>
      <textarea pInputTextarea id="ocd-cr" formControlName="requisites" rows="2" class="w-full"></textarea>
    </div>
  </form>
  <ng-template pTemplate="footer">
    <p-button label="Отмена" [text]="true" (onClick)="customerDialogVisible = false" />
    <p-button
      label="Сохранить"
      [loading]="customerSaving"
      [disabled]="customerForm.invalid || customerSaving"
      (onClick)="saveCustomerDialog()"
    />
  </ng-template>
</p-dialog>
