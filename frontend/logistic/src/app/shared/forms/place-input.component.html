<div class="place-input">
  <div class="field">
    <label [for]="inputId">{{ addressLabel }}</label>
    <p-autoComplete
      [inputId]="inputId"
      [formControl]="addressControl"
      [suggestions]="suggestions"
      (completeMethod)="complete($event)"
      (onSelect)="onSelect($event)"
      optionLabel="address"
      optionValue="address"
      [forceSelection]="false"
      [dropdown]="true"
      appendTo="body"
      styleClass="w-full"
      inputStyleClass="w-full"
      [minLength]="0"
    />
  </div>
  <div class="contact-row">
    <div class="field contact-field">
      <label [for]="contactInputId">{{ contactLabel }}</label>
      <input
        pInputText
        type="text"
        [id]="contactInputId"
        [formControl]="contactControl"
        placeholder="ФИО, телефон"
        class="w-full"
      />
    </div>
    @if (showSaveAsPlace) {
      <p-button
        type="button"
        icon="pi pi-bookmark"
        [text]="true"
        rounded="true"
        severity="secondary"
        aria-label="Сохранить как место"
        title="Сохранить как место"
        (onClick)="openSaveDialog()"
      />
    }
  </div>
</div>

<p-dialog
  [header]="'Сохранить место в справочник'"
  [(visible)]="saveDialogVisible"
  [modal]="true"
  [style]="{ width: 'min(28rem, 95vw)' }"
  [appendTo]="'body'"
>
  <form [formGroup]="saveDialogForm" class="save-dialog-form">
    <div class="field">
      <label for="savePlaceAddr">Адрес</label>
      <input pInputText id="savePlaceAddr" formControlName="address" class="w-full" />
    </div>
    <div class="field">
      <label for="savePlaceCt">Контакт</label>
      <input pInputText id="savePlaceCt" formControlName="contact" class="w-full" />
    </div>
    <div class="field">
      <label for="savePlaceType">Тип</label>
      <p-dropdown
        inputId="savePlaceType"
        formControlName="placeType"
        [options]="saveTypeOptions"
        optionLabel="label"
        optionValue="value"
        appendTo="body"
        styleClass="w-full"
      />
    </div>
  </form>
  <ng-template pTemplate="footer">
    <p-button
      label="Отмена"
      severity="secondary"
      [text]="true"
      (onClick)="saveDialogVisible = false"
    />
    <p-button
      label="Сохранить"
      icon="pi pi-check"
      [loading]="saveSaving"
      [disabled]="saveDialogForm.invalid || saveSaving"
      (onClick)="saveNewPlace()"
    />
  </ng-template>
</p-dialog>
