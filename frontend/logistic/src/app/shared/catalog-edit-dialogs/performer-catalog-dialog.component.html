<p-dialog
  [header]="dialogHeader()"
  [(visible)]="visible"
  [modal]="true"
  [style]="{ width: '28rem' }"
  [draggable]="false"
>
  <form [formGroup]="form" (ngSubmit)="save()" class="ccd-form">
    <div class="field">
      <label for="ccd-pf-sn">Краткое название *</label>
      <input pInputText id="ccd-pf-sn" formControlName="shortName" class="w-full" />
      @if (form.controls.shortName.touched && form.controls.shortName.invalid) {
        <small class="p-error">Обязательное поле</small>
      }
    </div>
    <div class="field">
      <label for="ccd-pf-fn">Полное название</label>
      <input pInputText id="ccd-pf-fn" formControlName="fullName" class="w-full" />
    </div>
    <div class="field">
      <label for="ccd-pf-ph">Телефон</label>
      <input pInputText id="ccd-pf-ph" formControlName="phone" class="w-full" />
    </div>
    <div class="field">
      <label for="ccd-pf-inn">ИНН</label>
      <input pInputText id="ccd-pf-inn" formControlName="inn" class="w-full" />
      @if (form.controls.inn.touched && form.controls.inn.hasError('inn')) {
        <small class="p-error">10 или 12 цифр</small>
      }
    </div>
    <div class="field">
      <label for="ccd-pf-bank">Банк</label>
      <input pInputText id="ccd-pf-bank" formControlName="bankName" class="w-full" />
    </div>
    <div class="field">
      <label for="ccd-pf-bik">БИК</label>
      <input pInputText id="ccd-pf-bik" formControlName="bik" class="w-full" />
    </div>
    <div class="field">
      <label for="ccd-pf-kpp">КПП</label>
      <input pInputText id="ccd-pf-kpp" formControlName="kpp" class="w-full" />
    </div>
    <div class="field">
      <label for="ccd-pf-rs">Расчётный счёт</label>
      <input pInputText id="ccd-pf-rs" formControlName="paymentAccount" class="w-full" />
    </div>
    <div class="field">
      <label for="ccd-pf-ks">Корр. счёт</label>
      <input pInputText id="ccd-pf-ks" formControlName="corrAccount" class="w-full" />
    </div>
    <div class="field">
      <label for="ccd-pf-rq">Реквизиты (текст)</label>
      <textarea
        pInputTextarea
        id="ccd-pf-rq"
        formControlName="requisites"
        rows="2"
        class="w-full"
      ></textarea>
    </div>
  </form>
  <div class="dialog-actions">
    <p-button
      type="button"
      label="Отмена"
      severity="secondary"
      [outlined]="true"
      (onClick)="close()"
    />
    <p-button
      type="button"
      label="Сохранить"
      icon="pi pi-check"
      [loading]="saving"
      [disabled]="form.invalid || saving"
      (onClick)="save()"
    />
  </div>
</p-dialog>
