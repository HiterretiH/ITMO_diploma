<p-dialog
  [header]="dialogHeader()"
  [(visible)]="visible"
  [modal]="true"
  [style]="{ width: '24rem' }"
  [draggable]="false"
>
  <form [formGroup]="form" (ngSubmit)="save()" class="ccd-form">
    @if (performerLockedId == null) {
      <div class="field">
        <label for="ccd-dr-perf">Исполнитель *</label>
        <p-dropdown
          inputId="ccd-dr-perf"
          formControlName="performerId"
          [options]="performerOptions()"
          optionLabel="label"
          optionValue="value"
          placeholder="—"
          appendTo="body"
          styleClass="w-full"
        />
      </div>
    }
    <div class="field">
      <label for="ccd-dr-name">ФИО *</label>
      <input
        pInputText
        id="ccd-dr-name"
        formControlName="fullName"
        class="w-full"
        placeholder="Например: Иванов Иван Иванович"
      />
      @if (form.controls.fullName.touched && form.controls.fullName.invalid) {
        <small class="p-error">Обязательное поле</small>
      }
    </div>
    <div class="field">
      <label for="ccd-dr-ph">Телефон</label>
      <input
        pInputText
        id="ccd-dr-ph"
        formControlName="phone"
        class="w-full"
        placeholder="Например: +7 900 555-44-33"
      />
    </div>
  </form>
  <div class="dialog-actions">
    <p-button
      type="button"
      label="Отмена"
      severity="secondary"
      [outlined]="true"
      (onClick)="close()"
    />
    <p-button
      type="button"
      [label]="editingId != null ? 'Сохранить' : 'Создать'"
      icon="pi pi-check"
      [loading]="saving"
      [disabled]="form.invalid || saving"
      (onClick)="save()"
    />
  </div>
</p-dialog>
