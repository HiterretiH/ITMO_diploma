      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64

  schemas:
    ProblemDetail:
      type: object
      description: RFC 7807 Problem Details (application/problem+json)
      properties:
        type:
          type: string
          nullable: true
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
          nullable: true
        instance:
          type: string
          nullable: true
        errors:
          type: array
          nullable: true
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string

    Role:
      type: string
      enum: [USER, ADMIN]

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1

    RegisterRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 128
        password:
          type: string
          minLength: 6
          maxLength: 128

    PasswordChangeRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 6
          maxLength: 128

    JwtResponse:
      type: object
      properties:
        token:
          type: string

    UserCreateRequest:
      type: object
      required: [username, password, roles]
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
        roles:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Role'

    UserResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'

    CustomerRequest:
