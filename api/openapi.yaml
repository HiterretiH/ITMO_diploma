openapi: 3.0.3
info:
  title: Logistic Document API
  version: 1.0.0
  description: >
    REST API for managing customers, performers, vehicles, drivers, orders,
    audit log, and generated transport documents.

servers:
  - url: http://localhost:8080
    description: Local development

tags:
  - name: Auth
  - name: Admin
  - name: Customers
  - name: Performers
  - name: Drivers
  - name: Vehicles
  - name: Orders
  - name: Documents
  - name: Audit
  - name: Session

paths:
  /api/v1/me:
    get:
      tags: [Session]
      summary: Current user profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User id, username, and roles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/me/password:
    put:
      tags: [Session]
      summary: Change password for the current user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
      responses:
        '204':
          description: Password updated
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/me/trip-form-draft:
    get:
      tags: [Session]
      summary: Defaults for new trip form (next order number, last catalog picks)
      description: >
        nextOrderNumber is max(order_number)+1 for the order owner: when customerId is set,
        that customer's owner; otherwise the authenticated user's id is used as owner scope.
        Last IDs are sanitized (wrong performer pairing yields nulls).
      security:
        - bearerAuth: []
      parameters:
        - name: customerId
          in: query
          required: false
          schema:
            type: integer
            format: int64
          description: Optional customer scope for previewing the next order number
      responses:
        '200':
          description: Draft hints for trip creation form
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripFormDraftResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Login and get JWT token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              sample:
                summary: Employee login
                value:
                  username: emp_demo
                  password: secret
      responses:
        '200':
          description: JWT token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JwtResponse'
              examples:
                sample:
                  value:
                    token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.example
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Register as USER and get JWT token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created; JWT token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JwtResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/admin/users:
    post:
      tags: [Admin]
      summary: Create user (ADMIN only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      responses:
        '200':
          description: Created user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/customers:
    get:
      tags: [Customers]
      summary: List customers
      security:
        - bearerAuth: []
      parameters:
        - in: query
