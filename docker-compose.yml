services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: logistic
      POSTGRES_USER: logistic
      POSTGRES_PASSWORD: logistic
    ports:
      - "7727:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logistic -d logistic"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/logistic
      SPRING_DATASOURCE_USERNAME: logistic
      SPRING_DATASOURCE_PASSWORD: logistic
      LOGISTIC_STORAGE_ROOT: /data/docs
      JWT_SECRET: docker-dev-change-this-secret-min-32-chars-long!!!
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "7272:8080"
    volumes:
      - docs:/data/docs

  frontend:
    build:
      context: ./frontend/logistic
      dockerfile: Dockerfile
    depends_on:
      - backend
    ports:
      - "4200:80"

volumes:
  pgdata:
  docs:
